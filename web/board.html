<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>sbc-emu board</title>
<meta name="description" content="A single-board computer booting Linux in your browser, on an emulator compiled to WebAssembly.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
<style>
  :root { --mask: #103b2c; --mask-3: #0b2a1f; --silk: #eef0e6; --silk-2: #9db5a8; --gold: #d4af5a; }
  * { box-sizing: border-box; }
  html { background: var(--mask); }
  body { margin: 0; color: var(--silk); font: 16px/1.5 system-ui, -apple-system, sans-serif;
    background: radial-gradient(circle at 1px 1px, rgba(238,240,230,.06) 1px, transparent 1.4px) 0 0 / 22px 22px, var(--mask); }
  main { max-width: 900px; margin: 0 auto; padding: 20px 16px 40px; }
  h1 { font-size: clamp(26px, 5vw, 38px); line-height: 1.1; margin: 0 0 6px; }
  h1 a { color: inherit; text-decoration: none; }
  .lede { margin: 0 0 18px; color: var(--silk-2); }
  a { color: var(--gold); }
  .term { position: relative; height: min(70vh, 520px); background: #0b0b0b; border: 2px solid var(--silk-2); border-radius: 6px; padding: 8px; overflow: hidden; }
  .term:focus-within { border-color: var(--gold); }
  #xterm { height: 100%; }
  .power { position: absolute; inset: 0; display: grid; place-content: center; justify-items: center; gap: 14px; padding: 20px; text-align: center;
    background: radial-gradient(ellipse at center, #0f2f24 0%, #000 75%); z-index: 5; }
  .power[hidden] { display: none; }
  .power button { font: 700 22px/1 system-ui, sans-serif; color: var(--mask); background: var(--gold); border: 0; border-radius: 999px; padding: 16px 30px; cursor: pointer; }
  .power button:disabled { cursor: progress; opacity: .7; }
  .power p { margin: 0; color: var(--silk-2); font-size: 14px; max-width: 28rem; }
  #status { margin: 8px 0 14px; color: var(--silk-2); font-size: 14px; font-variant-numeric: tabular-nums; min-height: 1.5em; }
  .screen { margin: 14px 0 0; background: #000; border: 2px solid var(--silk-2); border-radius: 6px; overflow: hidden; }
  .screen:focus { outline: none; border-color: var(--gold); }
  .screen[hidden] { display: none; }
  .screen canvas { display: block; width: 100%; height: auto; }
  .try { display: flex; flex-wrap: wrap; gap: 8px; }
  .try button { font: 14px ui-monospace, Menlo, monospace; padding: 9px 14px; border-radius: 6px; border: 1px solid var(--silk-2); background: transparent; color: var(--silk); cursor: pointer; }
  .try button:not(:disabled):hover { border-color: var(--gold); color: var(--gold); }
  .try button:disabled { opacity: .45; cursor: default; }
  footer { margin-top: 26px; color: var(--silk-2); font-size: 14px; }
</style>
</head>
<body>
<main>
  <h1><a href="./">sbc-emu</a>: <span id="name">a board</span> in your browser</h1>
  <p class="lede" id="lede"></p>
  <div class="term">
    <div id="xterm"></div>
    <div class="power" id="power">
      <button id="powerbtn" type="button">Power on</button>
      <p id="powernote"></p>
    </div>
  </div>
  <p id="status" aria-live="polite"></p>
  <div class="try" id="try"></div>
  <div class="screen" id="screen" tabindex="0" role="application" aria-label="The HDMI monitor; type here on its USB keyboard, Shift and Tab to leave" hidden><canvas id="canvas" width="1280" height="720" role="img" aria-label="The picture on the HDMI monitor"></canvas></div>
  <footer>The terminal is the board's serial console: click it and type.<span id="hdminote" hidden> The picture is its HDMI monitor: with a keyboard, click it and type (Shift+Tab leaves it).</span><br>
    <a href="./">All boards</a> · <a href="https://github.com/joakimeriksson/sbc-emu">Source on GitHub</a> · <a href="sources.html">What runs here, and its licences</a> · <span id="tm"></span></footer>
</main>
<script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
<script>
// The boards whose demo is a shell on the serial console (worker.js boots them by `os`).
const BOARDS = {
  'orangepi-one': {
    name: 'Orange Pi One', os: 'orangepi-one', ramMb: 512,
    lede: 'Alpine Linux’s kernel and a BusyBox shell, booting from scratch on an emulated Allwinner H3: four 32-bit Cortex-A7 cores, translated to WebAssembly as they run. Nothing runs on a server.',
    note: 'Downloads 15 MB (the emulator, Alpine’s kernel and a small initramfs) and boots Linux, in under 10 seconds on a fast computer.',
    tm: 'Orange Pi is a trademark of Shenzhen Xunlong Software Co.; Allwinner is a trademark of Allwinner Technology. sbc-emu is not affiliated with either.',
    try: ['uname -a', 'cat /proc/device-tree/model; echo', 'grep -c processor /proc/cpuinfo', 'cat /proc/cpuinfo | head -12', 'cat /proc/interrupts', 'free -m', 'dmesg | tail -15'],
  },
  'tinker-board': {
    name: 'ASUS Tinker Board S', os: 'tinker-busybox', ramMb: 1024,
    lede: 'Debian’s kernel with the board’s own device tree and a BusyBox shell, booting from scratch on an emulated Rockchip RK3288: four 32-bit Cortex-A12 cores, translated to WebAssembly as they run. Nothing runs on a server.',
    note: 'Downloads 11 MB (the emulator, Debian’s kernel and a small initramfs) and boots Linux, in under 10 seconds on a fast computer.',
    tm: 'ASUS and Tinker Board are trademarks of ASUSTeK Computer Inc.; Rockchip is a trademark of Rockchip Electronics Co., Ltd. sbc-emu is not affiliated with either.',
    try: ['uname -a', 'cat /proc/device-tree/model; echo', 'grep -c processor /proc/cpuinfo', 'cat /proc/cpuinfo | head -12', 'cat /proc/interrupts', 'free -m', 'dmesg | tail -15'],
  },
  'orangepi-rv': {
    name: 'Orange Pi RV', os: 'orangepi-rv', ramMb: 1024,
    lede: 'OpenSBI and Alpine Linux’s mainline kernel booting from scratch on an emulated StarFive JH7110: four 64-bit RISC-V cores, translated to WebAssembly as they run. Nothing runs on a server.',
    note: 'Downloads 17 MB (the emulator, OpenSBI, Alpine’s kernel and a small initramfs) and boots Linux, in about 5 seconds on a fast computer.',
    tm: 'Orange Pi is a trademark of Shenzhen Xunlong Software Co.; StarFive is a trademark of StarFive Technology. sbc-emu is not affiliated with either.',
    try: ['uname -a', 'cat /proc/device-tree/model; echo', 'cat /proc/cpuinfo | head -12', 'ip link set eth0 up; sleep 3; udhcpc -i eth0 -n -q', 'ping -c 3 10.0.2.2', 'lsusb 2>/dev/null || ls /sys/bus/usb/devices', 'free -m', 'dmesg | tail -15'],
  },
  'orangepi5': {
    name: 'Orange Pi 5', os: 'orangepi5', ramMb: 512,
    lede: 'Debian’s kernel and a BusyBox shell, booting from scratch on an emulated Rockchip RK3588S: four of its 64-bit Cortex-A55 cores, translated to WebAssembly as they run. Nothing runs on a server.',
    note: 'Downloads 20 MB (the emulator, Debian’s kernel and a small initramfs) and boots Linux, in under 10 seconds on a fast computer.',
    tm: 'Orange Pi is a trademark of Shenzhen Xunlong Software Co.; Rockchip is a trademark of Rockchip Electronics Co., Ltd. sbc-emu is not affiliated with either.',
    try: ['uname -a', 'cat /proc/device-tree/model; echo', 'grep -c processor /proc/cpuinfo', 'cat /proc/cpuinfo | head -12', 'cat /proc/interrupts', 'free -m', 'dmesg | tail -15'],
  },
  'jetson-nano': {
    name: 'Jetson Nano', os: 'jetson-nano', ramMb: 1024, screen: true,
    lede: 'Debian’s kernel with the board’s own device tree and a BusyBox shell, booting from scratch on an emulated Tegra X1: four 64-bit Cortex-A57 cores, translated to WebAssembly as they run, with HDMI, USB, Ethernet and the Maxwell GPU found by Linux’s own drivers. Nothing runs on a server.',
    note: 'Downloads 23 MB (the emulator, Debian’s kernel and a small initramfs) and boots Linux, in about 15 seconds on a fast computer.',
    tm: 'NVIDIA, Jetson and Tegra are trademarks of NVIDIA Corporation. sbc-emu is not affiliated with NVIDIA, and none of its firmware is downloaded.',
    try: ['uname -a', 'cat /proc/device-tree/model; echo', 'grep -c processor /proc/cpuinfo', 'dmesg | grep -i nouveau', 'ls /dev/dri', 'ip link set eth0 up; sleep 3; udhcpc -i eth0 -n -q', 'cat /proc/interrupts | head -30', 'free -m', 'cat /dev/urandom > /dev/fb0'],
  },
  'esp32s31': {
    name: 'ESP32-S31 Function CoreBoard', os: 'esp32s31', ramMb: 0,
    lede: 'A microcontroller running Linux: Espressif’s official flash image boots through the chip’s own mask ROM, U-Boot, OpenSBI and U-Boot again to Linux, on an emulated ESP32-S31 with two 32-bit RISC-V cores and 16 MB of RAM. Nothing runs on a server.',
    note: 'Downloads 10 MB (the emulator, Espressif’s ROM and the 16 MB flash image, compressed) and boots the whole chain to a root shell in about 10 seconds on a fast computer.',
    tm: 'Espressif and ESP32 are trademarks of Espressif Systems (Shanghai) Co., Ltd. sbc-emu is not affiliated with Espressif.',
    try: ['uname -a', 'cat /proc/device-tree/model; echo', 'cat /proc/cpuinfo', 'cat /proc/meminfo | head -3', 'cat /proc/interrupts', 'ls /', 'dmesg | tail -15'],
  },
};
const $ = (id) => document.getElementById(id);
const id = new URLSearchParams(location.search).get('b') || 'orangepi-one';
const board = BOARDS[id] || BOARDS['orangepi-one'];
document.title = `sbc-emu ${board.name}`;
$('name').textContent = `an ${board.name}`.replace(/^an ([^AEIOU])/, 'a $1');
$('lede').textContent = board.lede;
$('powernote').textContent = board.note;
$('tm').textContent = board.tm;
for (const c of board.try) { const b = document.createElement('button'); b.type = 'button'; b.disabled = true; b.textContent = c; $('try').append(b); }

const term = new Terminal({ fontFamily: 'ui-monospace, Menlo, Consolas, monospace', fontSize: 14, cursorBlink: true, scrollback: 5000,
  theme: { background: '#0b0b0b', foreground: '#d6d6d6', cursor: '#d4af5a' } });
const fit = new FitAddon.FitAddon();
term.loadAddon(fit);
term.open($('xterm'));
fit.fit();
addEventListener('resize', () => fit.fit());
let worker = null;
const ctx = $('canvas').getContext('2d');
$('screen').hidden = $('hdminote').hidden = !board.screen;
const serial = (text) => worker?.postMessage({ type: 'serial', bytes: [...new TextEncoder().encode(text)] });
term.onData(serial);
$('try').onclick = (e) => { if (e.target.tagName === 'BUTTON') { serial(e.target.textContent + '\r'); term.focus(); } };

$('powerbtn').onclick = () => {
  $('powerbtn').disabled = true;
  worker = new Worker('worker.js');
  let state = '';
  worker.onmessage = (e) => {
    const m = e.data;
    if (m.type === 'status') {
      state = m.text; $('status').textContent = state;
      if (state === 'booting…') { $('power').hidden = true; document.querySelectorAll('#try button').forEach((b) => b.disabled = false); term.focus(); }
      if (m.phase === 'error') $('powerbtn').disabled = false;
    } else if (m.type === 'uart') {
      term.write(m.text);
    } else if (m.type === 'frame' && board.screen) {
      if ($('canvas').width !== m.w || $('canvas').height !== m.h) { $('canvas').width = m.w; $('canvas').height = m.h; }
      ctx.putImageData(new ImageData(new Uint8ClampedArray(m.data.buffer), m.w, m.h), 0, 0);
    } else if (m.type === 'stats') {
      $('status').textContent = `running · ${m.mips.toFixed(0)} million instructions/s · guest time ${m.simS.toFixed(1)} s` + (m.jit ? ` · ${m.jit} blocks compiled to WebAssembly` : '');
    }
  };
  worker.postMessage({ type: 'start', os: board.os, ramMb: board.ramMb, jit: new URLSearchParams(location.search).get('jit') !== '0' });
};
// the monitor takes the keyboard (USB HID usages)
const HID = { Enter: 0x28, Escape: 0x29, Backspace: 0x2a, Tab: 0x2b, Space: 0x2c, Minus: 0x2d, Equal: 0x2e, BracketLeft: 0x2f, BracketRight: 0x30,
  Backslash: 0x31, Semicolon: 0x33, Quote: 0x34, Backquote: 0x35, Comma: 0x36, Period: 0x37, Slash: 0x38, CapsLock: 0x39, PrintScreen: 0x46,
  ScrollLock: 0x47, Pause: 0x48, Insert: 0x49, Home: 0x4a, PageUp: 0x4b, Delete: 0x4c, End: 0x4d, PageDown: 0x4e, ArrowRight: 0x4f,
  ArrowLeft: 0x50, ArrowDown: 0x51, ArrowUp: 0x52, NumLock: 0x53, IntlBackslash: 0x64, ControlLeft: 0xe0, ShiftLeft: 0xe1, AltLeft: 0xe2,
  MetaLeft: 0xe3, ControlRight: 0xe4, ShiftRight: 0xe5, AltRight: 0xe6, MetaRight: 0xe7 };
for (let i = 0; i < 26; i++) HID['Key' + String.fromCharCode(65 + i)] = 0x04 + i;
for (let i = 1; i <= 9; i++) HID['Digit' + i] = 0x1d + i;
HID.Digit0 = 0x27;
for (let i = 1; i <= 12; i++) HID['F' + i] = 0x39 + i;
const held = new Set();
const key = (usage, down) => worker?.postMessage({ type: 'key', usage, down });
$('screen').addEventListener('keydown', (e) => {
  const u = HID[e.code];
  // (Shift+Tab is for leaving the monitor)
  if (!worker || u === undefined || (e.metaKey && e.code !== 'MetaLeft' && e.code !== 'MetaRight') || (e.code === 'Tab' && e.shiftKey)) return;
  e.preventDefault();
  if (!held.has(u)) { held.add(u); key(u, true); }
});
$('screen').addEventListener('keyup', (e) => { const u = HID[e.code]; if (u === undefined) return; e.preventDefault(); if (held.delete(u)) key(u, false); });
$('screen').addEventListener('blur', () => { for (const u of held) key(u, false); held.clear(); });
if (new URLSearchParams(location.search).has('autostart')) $('powerbtn').click();
</script>
</body>
</html>
