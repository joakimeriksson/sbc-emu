[package]
name = "sbc-emu-wasm"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "sbc-emu in the browser: C ABI over the Pi 4B, Tinker Board, Orange Pi One and Orange Pi RV machines, driven by web/worker.js"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bcm2711 = { path = "../bcm2711" }
v3d = { path = "../v3d" }
arm-a64 = { path = "../arm-a64" }
arm-a32 = { path = "../arm-a32" }
rockchip-rk3288 = { path = "../rockchip-rk3288" }
allwinner-h3 = { path = "../allwinner-h3" }
starfive-jh7110 = { path = "../starfive-jh7110" }
rk3588 = { path = "../rk3588" }
esp32s31 = { path = "../espressif/esp32s31" }
esp-soc = { path = "../espressif/esp-soc" }
riscv-rv32 = { path = "../riscv-rv32", features = ["wasm-jit"] }
riscv64 = { path = "../riscv64" }
emu-core = { path = "../emu-core" }
# zstd-recompressed snapshots for the public site (tools/snap-zstd.sh): pure Rust, decode only
ruzstd = { version = "0.7", default-features = false, features = ["std"] }
