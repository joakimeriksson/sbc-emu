<!doctype html>
<html><head><meta charset="utf-8"><title>effects</title>
<style>
body { margin: 0; font: 16px sans-serif; background: #eee; }
.g { display: grid; grid-template-columns: repeat(4, 300px); gap: 12px; padding: 12px; }
.g > div { height: 150px; border-radius: 18px; position: relative; overflow: hidden; }
.lin { background: linear-gradient(37deg, red, orange 10%, yellow 20%, lime 30%, cyan 40%, blue 50%, violet 60%, pink 70%, white 80%, gray 90%, black); }
.rad { background: radial-gradient(circle at 30% 40%, #fff, #f0a 20%, #0af 45%, #222 70%, #fc0); }
.con { background: conic-gradient(from 45deg, red, yellow, lime, aqua, blue, magenta, red); }
.rep { background: repeating-linear-gradient(-45deg, #333 0 6px, #ccc 6px 12px, #c33 12px 18px); }
.blur { background: url(#) , linear-gradient(90deg, #f00, #00f); filter: blur(6px); }
.shadow { background: #fff; box-shadow: 0 10px 40px 10px rgba(0,0,0,.6), inset 0 0 30px #0af; }
.drop { filter: drop-shadow(8px 8px 6px #000) hue-rotate(90deg) saturate(3); background: conic-gradient(#f00, #0f0, #00f, #f00); }
.back { background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='40' height='40'><circle cx='20' cy='20' r='14' fill='%23e33'/></svg>"); }
.back::after { content: "backdrop"; position: absolute; inset: 30px; backdrop-filter: blur(8px) contrast(1.5); border-radius: 30px; background: rgba(255,255,255,.2); padding: 10px; }
.turb { filter: url(#t); background: #48c; }
.txt { font-size: 34px; text-shadow: 2px 2px 3px #f0f, -3px -2px 8px #0ff; background: #234; color: #fff; padding: 8px; }
.blend { background: linear-gradient(red, blue); }
.blend span { position: absolute; inset: 20px; background: radial-gradient(yellow, green); mix-blend-mode: difference; border-radius: 50%; }
.spin { background: conic-gradient(#f80, #08f, #f80); animation: r 2s linear infinite; }
@keyframes r { to { transform: rotate(360deg) scale(.8); } }
.mask { background: linear-gradient(45deg, #0a0, #ff0); -webkit-mask-image: radial-gradient(circle, #000 40%, transparent 70%); }
.persp { background: linear-gradient(#a0f, #0fa); transform: perspective(300px) rotateY(35deg); }
canvas { display: block; }
</style></head><body>
<svg width="0" height="0" style="position:absolute"><filter id="t"><feTurbulence type="fractalNoise" baseFrequency="0.03" numOctaves="4"/><feDisplacementMap in="SourceGraphic" scale="30"/><feGaussianBlur stdDeviation="2"/></filter></svg>
<div class="g">
 <div class="lin"></div><div class="rad"></div><div class="con"></div><div class="rep"></div>
 <div class="blur"></div><div class="shadow"></div><div class="drop"></div><div class="back"></div>
 <div class="turb"></div><div class="txt">Shadow text Åäö</div><div class="blend"><span></span></div><div class="spin"></div>
 <div class="mask"></div><div class="persp"></div><div><canvas id="c" width="300" height="150"></canvas></div><div><canvas id="w" width="300" height="150"></canvas></div>
</div>
<script>
const c = document.getElementById('c').getContext('2d');
function draw2d(t) {
  const g = c.createRadialGradient(150, 75, 5, 150, 75, 140);
  g.addColorStop(0, '#fff'); g.addColorStop(0.3, '#f0f'); g.addColorStop(0.6, '#0ff'); g.addColorStop(1, '#000');
  c.fillStyle = g; c.fillRect(0, 0, 300, 150);
  c.shadowColor = 'rgba(0,0,0,.7)'; c.shadowBlur = 12; c.shadowOffsetX = 5;
  c.filter = 'blur(1px)';
  for (let i = 0; i < 8; i++) { c.beginPath(); c.arc(30 + i * 34, 75 + 30 * Math.sin(t / 300 + i), 14, 0, 7); c.fillStyle = `hsl(${i * 45},90%,50%)`; c.fill(); }
  c.filter = 'none'; c.shadowBlur = 0;
  c.font = 'italic 22px serif'; c.fillStyle = '#000'; c.fillText('canvas text', 80, 140);
}
const gl = document.getElementById('w').getContext('webgl');
let draw3d = () => {};
if (gl) {
  const sh = (t, s) => { const o = gl.createShader(t); gl.shaderSource(o, s); gl.compileShader(o); return o; };
  const p = gl.createProgram();
  gl.attachShader(p, sh(gl.VERTEX_SHADER, 'attribute vec2 a; uniform float t; varying vec2 v; void main(){ v=a; gl_Position=vec4(a*vec2(cos(t),1.0),0.0,1.0); }'));
  gl.attachShader(p, sh(gl.FRAGMENT_SHADER, 'precision mediump float; varying vec2 v; uniform float t; uniform vec3 k[8]; void main(){ vec3 c=vec3(0.0); for(int i=0;i<8;i++){ c+=k[i]*abs(sin(v.x*float(i)+t)); } gl_FragColor=vec4(fract(c),1.0); }'));
  gl.linkProgram(p); gl.useProgram(p);
  const b = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, b);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-.9,-.9, .9,-.9, 0,.9]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(p, 'a'); gl.enableVertexAttribArray(loc); gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const k = []; for (let i = 0; i < 24; i++) k.push((i * 37 % 23) / 40);
  gl.uniform3fv(gl.getUniformLocation(p, 'k'), k);
  const tl = gl.getUniformLocation(p, 't');
  draw3d = (t) => { gl.clearColor(.1, .1, .2, 1); gl.clear(gl.COLOR_BUFFER_BIT); gl.uniform1f(tl, t / 500); gl.drawArrays(gl.TRIANGLES, 0, 3); };
}
function frame(t) { draw2d(t); draw3d(t); requestAnimationFrame(frame); }
requestAnimationFrame(frame);
</script>
</body></html>
