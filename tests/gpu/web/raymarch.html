<!doctype html>
<html><head><meta charset="utf-8"><title>raymarch</title>
<style>body { margin: 0; background: #000; color: #8f8; font: 14px monospace; } canvas { width: 640px; height: 400px; display: block; } #status { position: absolute; top: 4px; left: 8px; }</style>
</head><body><canvas id="c" width="320" height="200"></canvas><div id="status"></div>
<script src="gl.js"></script>
<script>
// A ray-marched scene: a loop of up to 64 steps over a distance function of several objects,
// soft shadows (a second loop), and many values live at once, so the compiler spills registers.
const gl = glDemo(document.getElementById('c'));
const p = gl && gl.prog(FULLSCREEN_VS, `#version 300 es
precision highp float; in vec2 uv; out vec4 o; uniform float t; uniform vec4 balls[6]; uniform int nballs;
float sdBox(vec3 p, vec3 b) { vec3 q = abs(p) - b; return length(max(q, 0.0)) + min(max(q.x, max(q.y, q.z)), 0.0); }
float map(vec3 p, out int id) {
  float d = p.y + 1.0; id = 0;
  for (int i = 0; i < nballs; i++) {
    vec3 c = balls[i].xyz + vec3(sin(t + float(i)), 0.3 * cos(t * 1.3 + float(i)), 0.0);
    float s = length(p - c) - balls[i].w;
    if (s < d) { d = s; id = i + 1; }
  }
  float b = sdBox(p - vec3(0.0, -0.4, 2.5), vec3(0.6, 0.6, 0.6)) - 0.05;
  if (b < d) { d = b; id = 9; }
  return d;
}
vec3 normal(vec3 p) { int k; vec2 e = vec2(0.002, 0.0);
  return normalize(vec3(map(p + e.xyy, k) - map(p - e.xyy, k), map(p + e.yxy, k) - map(p - e.yxy, k), map(p + e.yyx, k) - map(p - e.yyx, k))); }
float shadow(vec3 ro, vec3 rd) { float r = 1.0, s = 0.02; int k;
  for (int i = 0; i < 24; i++) { float h = map(ro + rd * s, k); if (h < 0.001) return 0.0; r = min(r, 8.0 * h / s); s += clamp(h, 0.02, 0.3); if (s > 6.0) break; }
  return r; }
void main() {
  vec2 q = (uv - 0.5) * vec2(1.6, 1.0);
  vec3 ro = vec3(0.0, 0.3, -3.0), rd = normalize(vec3(q, 1.5));
  float s = 0.0; int id = -1;
  for (int i = 0; i < 64; i++) { int k; float d = map(ro + rd * s, k); if (d < 0.001) { id = k; break; } s += d; if (s > 12.0) break; }
  vec3 col = vec3(0.1, 0.12, 0.2) + 0.2 * q.y;
  if (id >= 0) {
    vec3 pos = ro + rd * s, n = normal(pos), l = normalize(vec3(0.6, 0.8, -0.4));
    vec3 base = id == 0 ? vec3(0.4 + 0.3 * mod(floor(pos.x * 2.0) + floor(pos.z * 2.0), 2.0)) : id == 9 ? vec3(0.9, 0.5, 0.2) : 0.5 + 0.5 * cos(vec3(0.0, 2.0, 4.0) + float(id));
    float dif = max(dot(n, l), 0.0) * shadow(pos + n * 0.01, l);
    col = base * (0.15 + dif) + pow(max(dot(reflect(rd, n), l), 0.0), 32.0) * 0.5;
  }
  o = vec4(pow(col, vec3(0.4545)), 1.0);
}`);
if (p) {
  gl.useProgram(p); fullscreenQuad(gl, p);
  const balls = [];
  for (let i = 0; i < 6; i++) balls.push(-1.5 + i * 0.6, 0.0, 1.5 + (i % 3) * 0.7, 0.25 + 0.05 * (i % 3));
  gl.uniform4fv(gl.getUniformLocation(p, 'balls'), balls);
  gl.uniform1i(gl.getUniformLocation(p, 'nballs'), 6);
  const tl = gl.getUniformLocation(p, 't'), tick = fpsMeter(gl);
  const frame = (ms) => { gl.uniform1f(tl, demoTime(ms)); gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); tick(); requestAnimationFrame(frame); };
  requestAnimationFrame(frame);
}
</script></body></html>
