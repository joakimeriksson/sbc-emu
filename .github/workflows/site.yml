name: Demo site

# Builds the browser demo (tools/site-build.sh) on every push to main and publishes it with
# GitHub Pages (Settings -> Pages -> Source: GitHub Actions). Pull requests build it without
# publishing, so a change that breaks the site shows before it merges.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build the demo site
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain with the wasm32 target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - uses: actions/cache@v4
        with:
          path: cache/site
          key: site-guest-${{ hashFiles('tools/site-build.sh', 'scripts/jetson-nano-debian-fixture.sh') }}
      - name: Build (guest downloads, snapshot, browser build)
        run: tools/site-build.sh
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out/site

  deploy:
    name: Publish to GitHub Pages
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
