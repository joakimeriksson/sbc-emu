name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR runs are cancelled; every commit on main finishes, so a regression
  # from one of two quick merges still shows on its own commit.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  macos:
    name: macOS (Apple silicon) - all tests, JIT, release build
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Tests (interpreter and JIT, differential tests against the host CPU)
        run: cargo test --release --workspace
      - name: JIT on for the CPU tests too
        run: SBC_JIT=1 cargo test --release -p arm-a64
      - name: Release build
        run: cargo build --release
      # the Raspberry Pi 3's H.264 decoder (opt-in: docs/raspberry-pi-3.md#video-decode)
      - name: With the h264 feature
        run: |
          cargo test --release -p bcm2837 --features h264
          cargo build --release --features h264

  linux:
    name: Linux x86-64 - tests, A64 JIT to x86-64
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Tests
        run: cargo test --release --workspace
      - name: Tests with the h264 feature (the decoder's x86-64 paths)
        run: cargo test --release -p bcm2837 --features h264
      # the A64 JIT's x86-64 backend: every arm-a64 test with it on (its differential test
      # against the interpreter and its encoder test against llvm-mc run in the step above)
      - name: JIT on for the CPU tests too
        run: SBC_JIT=1 cargo test --release -p arm-a64

  wasm:
    name: WebAssembly build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain with the wasm32 target
        run: |
          rustup show active-toolchain || rustup toolchain install
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      - name: Check the browser build
        run: cargo check --target wasm32-unknown-unknown -p sbc-emu-wasm
      - name: The Raspberry Pi 3 crate, without and with the h264 feature
        run: |
          cargo check --target wasm32-unknown-unknown -p bcm2837
          cargo check --target wasm32-unknown-unknown -p bcm2837 --features h264
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # the Jetson Nano's shader JIT: its WebAssembly code against the interpreter, in the build the page loads
      - name: Shader JIT in the browser build
        run: |
          sh tools/wasm-build.sh
          node tools/wasm-shader-jit-check.mjs 20000
