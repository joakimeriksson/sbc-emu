name: Release

# A tag v* builds the release binaries and creates a DRAFT GitHub release with them; a maintainer
# reviews it and publishes it by hand. "Run workflow" (workflow_dispatch) on any branch is a dry
# run: the same builds, archives and notes, kept as workflow artifacts, and no release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-latest
          # the oldest supported runner, so the binary needs only glibc 2.35
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain (from rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
        with:
          key: dist
      - name: Version
        id: version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "sbc-emu") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "${GITHUB_REF_TYPE}" = tag ] && [ "${GITHUB_REF_NAME}" != "v$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match the workspace version $version (Cargo.toml)"
            exit 1
          fi
      - name: Build (profile dist, stripped)
        run: cargo build --locked --profile dist -p sbc-emu
      - name: Check the binary
        run: |
          target/dist/sbc-emu --version
          target/dist/sbc-emu --version | grep -Eq "^sbc-emu ${{ steps.version.outputs.version }}( |$)"
      - name: Archive
        shell: bash
        run: |
          name=sbc-emu-${{ steps.version.outputs.version }}-${{ matrix.target }}
          mkdir -p "dist/$name/riscv-rv32" "dist/$name/espressif/esp-periph"
          cp target/dist/sbc-emu LICENSE README.md CHANGELOG.md "dist/$name/"
          cp riscv-rv32/LICENSE "dist/$name/riscv-rv32/"
          cp espressif/LICENSE "dist/$name/espressif/"
          cp espressif/esp-periph/LICENSE-ADC "dist/$name/espressif/esp-periph/"
          # no AppleDouble (._*) files from macOS tar
          COPYFILE_DISABLE=1 tar -C dist -czf "dist/$name.tar.gz" "$name"
          tar -tzvf "dist/$name.tar.gz"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7

  release:
    name: Draft release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: |
          sha256sum *.tar.gz > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes (the version's CHANGELOG.md section)
        id: notes
        run: |
          version=$(ls dist | sed -n 's/^sbc-emu-\([0-9][^-]*\)-.*\.tar\.gz$/\1/p' | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          # from the version's heading to the next version's heading (or the link list)
          awk -v v="$version" '
            /^## \[/ { if (on) exit; if (index($0, "## [" v "]") == 1) { on = 1; next } }
            /^\[[^]]*\]: / { if (on) exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::CHANGELOG.md has no section for $version"
            exit 1
          fi
          if grep -q "^## \[$version\] - unreleased" CHANGELOG.md; then
            echo "::warning::CHANGELOG.md still says $version is unreleased: set the date before publishing"
          fi
          cat >> notes.md <<EOF

          ### Downloads

          Each archive holds the \`sbc-emu\` binary, the licenses, README.md and CHANGELOG.md; SHA256SUMS
          has their checksums (\`sha256sum -c SHA256SUMS\`). The binaries are unsigned: on macOS, after
          downloading with a browser, \`xattr -d com.apple.quarantine sbc-emu\`. Guest operating systems
          are not included; the fetch scripts and \`scripts/quickstart.sh\` are in the source tree.
          EOF
          cat notes.md
      - name: Create the draft release
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag \
            --title "sbc-emu ${{ steps.notes.outputs.version }}" --notes-file notes.md \
            dist/*.tar.gz dist/SHA256SUMS
      - name: Dry run (no release)
        if: ${{ !(github.event_name == 'push' && github.ref_type == 'tag') }}
        run: |
          echo "dry run: would create a draft release with:"
          ls -l dist
