[workspace]
resolver = "2"
members = ["emu-core", "arm-a64", "arm-a32", "v3d", "mali400", "midgard", "peripherals", "bcm2711", "allwinner-h3", "rockchip-rk3288","sbc-net", "cli", "wasm", "sbc-machine", "rk3588"]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"

[profile.release]
opt-level = 3
debug = 1

[profile.wasm]
inherits = "release"
lto = "fat"
codegen-units = 1
debug = 0
panic = "abort"
